apiVersion: apps/v1
kind: Deployment
metadata:
  name: coolsite
  labels:
    app: coolsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coolsite
  template:
    metadata:
      labels:
        app: coolsite
    spec:
      containers:
        - name: coolsite
          image: coolsite:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "28Mi"
              cpu: "100m"
            requests:
              memory: "24Mi"
              cpu: "50m"
      startupProbe:
        httpGet:
          path: /
          port: 3000
        failureThreshold: 10
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 3
        timeoutSeconds: 2
      readinessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 0
        periodSeconds: 3
        failureThreshold: 2
        successThreshold: 1
        timeoutSeconds: 2
